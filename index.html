<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBT Journal</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section id="login" hidden>
    <h1>CBT Journal</h1>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button>Sign in</button>
      <p id="login-error" role="alert"></p>
    </form>
  </section>

  <main id="app" hidden>
    <header>
      <span class="title">CBT Journal</span>
      <nav aria-label="Main navigation">
        <button data-view="home">Today</button>
        <button data-view="learn">Learn</button>
        <button data-view="thought">Thought record</button>
        <button data-view="activity">Activity plan</button>
        <button data-view="journal">Journal</button>
        <button data-view="settings">Data</button>
      </nav>
      <button id="logout">Sign out</button>
    </header>
    <p id="status" role="status"></p>
    <section id="view" tabindex="-1"></section>
    <footer>Personal reflection tool. Not a substitute for professional care.</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
